<title>La máquina de los dados</title>
<!-- «Atonalidad» · 2.3 · la máquina de los dados, en 3D (Claude para Iago, 11-oct-2026).
     Iago: «que lo integres en un modelo 3D… se tiene que ver como en una especie de mesa ese aparato… que el dado tenga
     un poquito de destello… que primero se tire un dado y luego el otro, con un solo clic».
     Va incrustada en la parada «dados» (paradas2.js), con el fondo transparente: detrás se ve la sala (N03, desenfocada).
     La página de fuera la maneja con window.__dados.tira(nota 1–12, figura 0–5).
     11-oct por la tarde (Froiz_9): «la manivela se mueve una vez y los dados se mueven uno detrás del otro sin volver a darle»,
     «se me hace muy largo», «los dados tendrían que ser dorados» y «sin ruidos de puerta» (fuera el pestillo de maquina_de_dados). -->
<style>
  :root { color-scheme: dark; }        /* igual que la página de fuera: si no, el navegador le pone un fondo opaco al marco */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="escena"></canvas>
<script type="importmap">{ "imports": { "three": "../candado/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from '../candado/RoundedBoxGeometry.js';

const fuera = (() => { try { return window.parent && window.parent !== window ? window.parent : null; } catch (e) { return null; } })();
const suena = (n, o) => { try { fuera && fuera.AT && fuera.AT.sfx(n, o); } catch (e) {} };
const azar = (a, b) => a + Math.random() * (b - a);
let listoOk; window.__dados = { listo: new Promise(ok => listoOk = ok) };

/* ───── el lienzo ───── */
const lienzo = document.getElementById('escena');
let render;
try {
  render = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true, alpha: true, preserveDrawingBuffer: true });
} catch (e) { window.__dados.sinWebGL = true; listoOk(false); throw e; }
render.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
render.outputColorSpace = THREE.SRGBColorSpace;
render.toneMapping = THREE.ACESFilmicToneMapping;
render.toneMappingExposure = 1.05;
render.shadowMap.enabled = true; render.shadowMap.type = THREE.PCFSoftShadowMap;
const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(30, 1, .1, 60);
camara.position.set(-1.2, 4.45, 4.95);          // algo desde arriba, para leer la cara de arriba de cada dado
const MIRA = new THREE.Vector3(.12, .5, 0);
camara.lookAt(MIRA);
function encaja() {
  const w = lienzo.clientWidth || innerWidth, h = lienzo.clientHeight || innerHeight;
  render.setSize(w, h, false); camara.aspect = w / h; camara.updateProjectionMatrix();
}
addEventListener('resize', encaja); encaja();

/* ───── el entorno: una sala oscura con una lámpara cálida arriba y dos ventanas frías (solo para los reflejos del metal) ───── */
{
  const sala = new THREE.Scene(), caja = new THREE.BoxGeometry(1, 1, 1);
  const pared = new THREE.Mesh(new THREE.BoxGeometry(14, 9, 14), new THREE.MeshBasicMaterial({ color: 0x1a120c, side: THREE.BackSide })); sala.add(pared);
  const luzE = (color, x, y, z, sx, sy, sz) => { const m = new THREE.Mesh(caja, new THREE.MeshBasicMaterial({ color })); m.position.set(x, y, z); m.scale.set(sx, sy, sz); sala.add(m); };
  luzE(0xfff0d0, -2, 4.2, 2, 3.2, .2, 3.2);          // la lámpara de arriba
  luzE(0xffb46a, 4, 1.5, 4, .2, 2.2, 1.6);           // un brillo cálido a un lado
  luzE(0x8fb4ff, -4, 2, -5, 2.2, 1.6, .2);           // y una ventana fría al fondo
  const pm = new THREE.PMREMGenerator(render);
  escena.environment = pm.fromScene(sala, .035).texture;
  escena.environmentIntensity = .9;
}
/* ───── luces: una lámpara cálida arriba a la izquierda (como en la sala), relleno suave y un contraluz frío ───── */
escena.add(new THREE.HemisphereLight(0xffe1b8, 0x2a1408, .55));
const lampara = new THREE.SpotLight(0xffd29a, 58, 22, Math.PI / 5.5, .55, 1.3);
lampara.position.set(-2.6, 5.2, 3.0); lampara.target.position.set(0, .5, 0);
lampara.castShadow = true; lampara.shadow.mapSize.set(1024, 1024); lampara.shadow.bias = -.0006; lampara.shadow.radius = 4;
escena.add(lampara, lampara.target);
const relleno = new THREE.DirectionalLight(0xffe8cc, .55); relleno.position.set(3, 2.5, 4); escena.add(relleno);
const contraluz = new THREE.DirectionalLight(0x9fc4ff, .9); contraluz.position.set(2.5, 3, -4); escena.add(contraluz);
const dentro = new THREE.PointLight(0xffe2b0, .9, 3.2, 1.6); dentro.position.set(0, 1.45, .3); escena.add(dentro);

/* ───── texturas hechas a mano (lienzo) ───── */
function lienzoTex(w, h, pinta, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; pinta(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const texMadera = lienzoTex(1024, 512, (g, w, h) => {
  g.fillStyle = '#4a2814'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {           // vetas
    const y = Math.random() * h, a = azar(.04, .16), oscura = Math.random() < .6;
    g.strokeStyle = oscura ? `rgba(20,8,2,${a})` : `rgba(160,92,44,${a})`; g.lineWidth = azar(.6, 3.2);
    g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * .006 + i) * azar(2, 9)); g.stroke();
  }
  const brillo = g.createLinearGradient(0, 0, 0, h); brillo.addColorStop(0, 'rgba(255,200,140,.08)'); brillo.addColorStop(1, 'rgba(0,0,0,.18)');
  g.fillStyle = brillo; g.fillRect(0, 0, w, h);
});
texMadera.wrapS = texMadera.wrapT = THREE.RepeatWrapping;
const texLaton = lienzoTex(512, 512, (g, w, h) => {
  g.fillStyle = '#a77a31'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 7000; i++) { const a = Math.random() * .08; g.fillStyle = Math.random() < .5 ? `rgba(50,30,6,${a})` : `rgba(255,232,170,${a})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  for (let i = 0; i < 90; i++) { g.strokeStyle = `rgba(255,236,190,${Math.random() * .12})`; g.lineWidth = Math.random(); g.beginPath(); const x = Math.random() * w, y = Math.random() * h; g.moveTo(x, y); g.lineTo(x + azar(-40, 40), y + azar(-4, 4)); g.stroke(); }
});
const texTerciopelo = lienzoTex(256, 256, (g, w, h) => {
  g.fillStyle = '#5a1222'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '20,0,6' : '150,40,60'},${Math.random() * .12})`; g.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5); }
});
const texReflejo = lienzoTex(256, 512, (g, w, h) => {      // los reflejos del cristal: dos franjas diagonales muy suaves
  g.clearRect(0, 0, w, h);
  [[.18, .16], [.5, .07]].forEach(([x, a]) => {
    const gr = g.createLinearGradient(x * w - 40, 0, x * w + 40, 0);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, `rgba(255,250,235,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.save(); g.translate(w / 2, h / 2); g.rotate(-.35); g.translate(-w / 2, -h / 2); g.fillStyle = gr; g.fillRect(-w, -h, w * 3, h * 3); g.restore();
  });
});
const texDestello = lienzoTex(128, 128, (g, w, h) => {
  const c = w / 2, r = g.createRadialGradient(c, c, 0, c, c, c);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.12, 'rgba(255,246,220,.9)'); r.addColorStop(.35, 'rgba(255,220,160,.22)'); r.addColorStop(1, 'rgba(255,200,140,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';
  [0, Math.PI / 2].forEach(a => { g.save(); g.translate(c, c); g.rotate(a); const l = g.createLinearGradient(-c, 0, c, 0);
    l.addColorStop(0, 'rgba(255,255,255,0)'); l.addColorStop(.5, 'rgba(255,255,255,.95)'); l.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = l; g.fillRect(-c, -1.6, w, 3.2); g.restore(); });
});

/* ───── materiales ───── */
const madera = new THREE.MeshStandardMaterial({ map: texMadera, roughness: .52, metalness: .05 });
const laton = new THREE.MeshStandardMaterial({ map: texLaton, roughness: .34, metalness: .82 });
const latonOscuro = new THREE.MeshStandardMaterial({ color: 0x6b4a1c, roughness: .45, metalness: .8 });
const terciopelo = new THREE.MeshStandardMaterial({ map: texTerciopelo, roughness: .95, metalness: 0 });
const cristal = new THREE.MeshStandardMaterial({ color: 0xdfeeff, roughness: .04, metalness: .15, transparent: true, opacity: .10, side: THREE.DoubleSide, depthWrite: false });
const reflejo = new THREE.MeshBasicMaterial({ map: texReflejo, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });

/* ───── la mesa (un pedestal de madera, como el de N03) ───── */
const mesa = new THREE.Group(); escena.add(mesa);
const tablero = new THREE.Mesh(new RoundedBoxGeometry(4.1, .22, 2.5, 4, .05), madera);
tablero.position.y = -.11; tablero.receiveShadow = true; tablero.castShadow = true; mesa.add(tablero);
const moldura = new THREE.Mesh(new RoundedBoxGeometry(3.8, .14, 2.25, 4, .04), madera);
moldura.position.y = -.29; mesa.add(moldura);
const pie = new THREE.Mesh(new THREE.BoxGeometry(3.3, 2.6, 1.95), madera);
pie.position.y = -1.66; pie.receiveShadow = true; mesa.add(pie);
// paneles tallados del frente del pedestal
[-0.82, 0.82].forEach(x => {
  const p = new THREE.Mesh(new RoundedBoxGeometry(1.25, 1.1, .06, 3, .03), madera); p.position.set(x, -1.05, .99); mesa.add(p);
});

/* ───── la máquina: base de latón, caja de cristal con marco, tapa y manivela ───── */
const maquina = new THREE.Group(); escena.add(maquina);
const base = new THREE.Mesh(new RoundedBoxGeometry(3.0, .26, 1.75, 4, .06), laton);
base.position.y = .13; base.castShadow = true; base.receiveShadow = true; maquina.add(base);
[[-1.38, -.76], [1.38, -.76], [-1.38, .76], [1.38, .76]].forEach(([x, z]) => {
  const p = new THREE.Mesh(new THREE.SphereGeometry(.09, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), laton); p.rotation.x = Math.PI; p.position.set(x, .02, z); maquina.add(p);
});
const SUELO = .27;                                          // altura del terciopelo
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 1.55), terciopelo);
suelo.rotation.x = -Math.PI / 2; suelo.position.y = SUELO; suelo.receiveShadow = true; maquina.add(suelo);
const ALTO = 1.38, AX = 1.42, AZ = .8;
function barra(largo, eje) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, largo, 14), laton); m.castShadow = true;
  if (eje === 'x') m.rotation.z = Math.PI / 2; if (eje === 'z') m.rotation.x = Math.PI / 2; return m;
}
[[-AX, -AZ], [AX, -AZ], [-AX, AZ], [AX, AZ]].forEach(([x, z]) => {
  const p = barra(ALTO, 'y'); p.position.set(x, SUELO + ALTO / 2, z); maquina.add(p);
  const bola = new THREE.Mesh(new THREE.SphereGeometry(.075, 18, 12), laton); bola.position.set(x, SUELO + ALTO + .17, z); maquina.add(bola);
});
[SUELO + .02, SUELO + ALTO].forEach(y => {
  [-AZ, AZ].forEach(z => { const b = barra(AX * 2, 'x'); b.position.set(0, y, z); maquina.add(b); });
  [-AX, AX].forEach(x => { const b = barra(AZ * 2, 'z'); b.position.set(x, y, 0); maquina.add(b); });
});
// los cristales (delante, detrás, a los lados y arriba) y sus reflejos
function cristalPlano(w, h, x, y, z, ry, rx = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), cristal); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); maquina.add(m); return m;
}
cristalPlano(AX * 2, ALTO, 0, SUELO + ALTO / 2, AZ, 0);
cristalPlano(AX * 2, ALTO, 0, SUELO + ALTO / 2, -AZ, 0);
cristalPlano(AZ * 2, ALTO, -AX, SUELO + ALTO / 2, 0, Math.PI / 2);
cristalPlano(AZ * 2, ALTO, AX, SUELO + ALTO / 2, 0, Math.PI / 2);
cristalPlano(AX * 2, AZ * 2, 0, SUELO + ALTO, 0, 0, -Math.PI / 2);
const ref = new THREE.Mesh(new THREE.PlaneGeometry(AX * 2 * .98, ALTO * .96), reflejo); ref.position.set(0, SUELO + ALTO / 2, AZ + .003); maquina.add(ref);
// la tapa, con un remate en abanico (como la concha de N03)
// la tapa es un marco de latón con cristal en medio (desde arriba se ven los dados)
[[3.08, .16, .16, 0, -.835], [3.08, .16, .16, 0, .835], [.16, .16, 1.83, -1.46, 0], [.16, .16, 1.83, 1.46, 0]].forEach(([w, h, d, x, z]) => {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, .04), laton); m.position.set(x, SUELO + ALTO + .08, z); m.castShadow = true; maquina.add(m);
});
const concha = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .07, 28, 1, false, -Math.PI / 2, Math.PI), laton);
concha.rotation.x = Math.PI / 2; concha.rotation.z = Math.PI / 2; concha.position.set(0, SUELO + ALTO + .16, .5);
concha.rotation.set(Math.PI / 2, 0, 0); concha.rotation.y = 0;
const conchaG = new THREE.Group(); conchaG.add(concha); concha.rotation.set(Math.PI / 2, Math.PI / 2, 0); concha.position.set(0, 0, 0);
conchaG.rotation.set(0, 0, 0); conchaG.position.set(0, SUELO + ALTO + .16, .2); maquina.add(conchaG);
for (let i = 0; i < 7; i++) {          // las estrías del abanico
  const a = -Math.PI / 2 + (i + .5) * Math.PI / 7;
  const e = new THREE.Mesh(new THREE.BoxGeometry(.018, .4, .085), latonOscuro);
  e.position.set(Math.sin(a) * .2, Math.cos(a) * .2, 0); e.rotation.z = -a; conchaG.add(e);
}
// la placa del frente
const texPlaca = lienzoTex(1024, 160, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#e9c983'); gr.addColorStop(.5, '#b8873c'); gr.addColorStop(1, '#d9b06a');
  g.fillStyle = gr; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(60,35,8,.8)'; g.lineWidth = 6; g.strokeRect(10, 10, w - 20, h - 20);
  g.fillStyle = '#3b2306'; g.font = '600 64px Lora, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('EL DADO COMPOSITOR', w / 2, h / 2 + 4);
});
const placa = new THREE.Mesh(new THREE.PlaneGeometry(1.25, .195), new THREE.MeshStandardMaterial({ map: texPlaca, roughness: .4, metalness: .6 }));
placa.position.set(0, .13, .876); maquina.add(placa);
// la manivela, a la derecha
const manivela = new THREE.Group(); manivela.position.set(AX + .1, SUELO + ALTO * .5, 0); maquina.add(manivela);
const eje = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, .3, 16), laton); eje.rotation.z = Math.PI / 2; eje.position.x = .1; manivela.add(eje);
const brazo = new THREE.Group(); brazo.position.x = .26; manivela.add(brazo);
const pala = new THREE.Mesh(new RoundedBoxGeometry(.07, .5, .09, 2, .025), laton); pala.position.y = .2; brazo.add(pala);
const puno = new THREE.Mesh(new THREE.CylinderGeometry(.065, .075, .3, 16), madera); puno.rotation.z = Math.PI / 2; puno.position.set(.15, .42, 0); brazo.add(puno);
[eje, pala, puno].forEach(m => m.castShadow = true);

/* ───── los dados ───── */
const NOMBRES = ['Do', 'Re♭', 'Re', 'Mi♭', 'Mi', 'Fa', 'Fa♯', 'Sol', 'La♭', 'La', 'Si♭', 'Si'];
const FIGS = [2, 1.5, 1, .75, .5, .25];            // blanca, negra con puntillo, negra, corchea con puntillo, corchea, semicorchea
const R12 = .35, L6 = .5;
const REPOSO12 = SUELO + R12 * .7947, REPOSO6 = SUELO + L6 / 2;     // la inradio del dodecaedro es 0,7947 × el radio
function texNumero(n) {
  return lienzoTex(256, 256, (g, w, h) => {
    g.clearRect(0, 0, w, h); g.fillStyle = '#24140a'; g.font = '700 132px Poppins, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(n), w / 2, h / 2 + 8);
    if (n === 6 || n === 9) g.fillRect(w / 2 - 34, h / 2 + 66, 68, 10);            // el 6 y el 9, subrayados
  });
}
function texNumeroBrillo(n) {
  return lienzoTex(256, 256, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.font = '700 132px Poppins, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(n), w / 2, h / 2 + 8); if (n === 6 || n === 9) g.fillRect(w / 2 - 34, h / 2 + 66, 68, 10);
  });
}
function texFiguraBrillo(val) {
  return lienzoTex(256, 256, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.strokeStyle = '#fff';
    const N = fuera && fuera.NOTACION; if (N && N.figuraNota) N.figuraNota(g, w / 2 - 22, h / 2 + 52, 36, val, true, false);
  });
}
function texFigura(val) {
  return lienzoTex(256, 256, (g, w, h) => {
    const gr = g.createRadialGradient(w * .38, h * .32, 10, w / 2, h / 2, w * .78); gr.addColorStop(0, '#ffe7a8'); gr.addColorStop(.55, '#e2b25a'); gr.addColorStop(1, '#a8752c');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { const a = Math.random() * .07; g.fillStyle = Math.random() < .5 ? `rgba(70,40,8,${a})` : `rgba(255,240,190,${a})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    g.strokeStyle = 'rgba(90,55,12,.45)'; g.lineWidth = 6; g.strokeRect(14, 14, w - 28, h - 28);
    g.fillStyle = '#1c1006'; g.strokeStyle = '#1c1006';
    const N = fuera && fuera.NOTACION;
    if (N && N.figuraNota) N.figuraNota(g, w / 2 - 22, h / 2 + 52, 36, val, true, false);
    else { g.font = '700 120px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('♪', w / 2, h / 2); }
  });
}
// el de doce caras: un dodecaedro de oro con los números grabados en cada cara (Iago, 11-oct: «tendrían que ser dorados»)
const d12 = new THREE.Group(); escena.add(d12);
const mat12 = new THREE.MeshStandardMaterial({ color: 0xe0ad55, map: texLaton, roughness: .3, metalness: .85, emissive: 0x000000 });
const geo12 = new THREE.DodecahedronGeometry(R12, 0);
const cuerpo12 = new THREE.Mesh(geo12, mat12); cuerpo12.castShadow = true; d12.add(cuerpo12);
const caras12 = [];             // [{ n: normal, t: «arriba» del número }], en el orden de los números 1–12
const calcos12 = [];            // los materiales de los números (para encender el de arriba)
{
  const pos = geo12.attributes.position, grupos = [];
  for (let i = 0; i < pos.count; i += 3) {
    const a = new THREE.Vector3().fromBufferAttribute(pos, i), b = new THREE.Vector3().fromBufferAttribute(pos, i + 1), c = new THREE.Vector3().fromBufferAttribute(pos, i + 2);
    const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a)).normalize();
    let gr = grupos.find(x => x.n.dot(n) > .999); if (!gr) { gr = { n, v: [] }; grupos.push(gr); }
    [a, b, c].forEach(p => { if (!gr.v.some(q => q.distanceTo(p) < 1e-4)) gr.v.push(p); });
  }
  grupos.forEach((gr, k) => {
    const centro = gr.v.reduce((s, p) => s.add(p), new THREE.Vector3()).multiplyScalar(1 / gr.v.length);
    const t = new THREE.Vector3().subVectors(gr.v[0], centro).normalize();
    const x = new THREE.Vector3().crossVectors(t, gr.n);
    const calco = new THREE.Mesh(new THREE.PlaneGeometry(.26, .26), new THREE.MeshStandardMaterial({ map: texNumero(k + 1), transparent: true, alphaTest: .05, roughness: .35, polygonOffset: true, polygonOffsetFactor: -2,
      emissive: 0xff2fb0, emissiveIntensity: 0, emissiveMap: texNumeroBrillo(k + 1) }));
    calcos12.push(calco.material);
    calco.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, t, gr.n));
    calco.position.copy(centro).addScaledVector(gr.n, .002); d12.add(calco);
    caras12.push({ n: gr.n.clone(), t });
  });
}
// el de seis caras: un cubo redondeado de oro, con una figura grabada en cada cara
const geo6 = new RoundedBoxGeometry(L6, L6, L6, 4, .055);
const mats6 = FIGS.map(v => new THREE.MeshStandardMaterial({ map: null, roughness: .32, metalness: .7, emissive: 0x000000 }));
const d6 = new THREE.Mesh(geo6, mats6); d6.castShadow = true; escena.add(d6);
const caras6 = [];
{
  // normal y «arriba» de la textura de cada cara, sacados de la propia geometría (la v de la textura crece hacia arriba)
  const pos = geo6.attributes.position, uv = geo6.attributes.uv, idx = geo6.index;
  geo6.groups.forEach(gr => {
    const tri = k => { const ia = idx ? idx.getX(k) : k, ib = idx ? idx.getX(k + 1) : k + 1, ic = idx ? idx.getX(k + 2) : k + 2;      // (la caja redondeada no va indexada)
      const a = new THREE.Vector3().fromBufferAttribute(pos, ia), b = new THREE.Vector3().fromBufferAttribute(pos, ib), c = new THREE.Vector3().fromBufferAttribute(pos, ic);
      return { a, b, c, n: b.clone().sub(a).cross(c.clone().sub(a)).normalize(), ua: new THREE.Vector2().fromBufferAttribute(uv, ia), ub: new THREE.Vector2().fromBufferAttribute(uv, ib), uc: new THREE.Vector2().fromBufferAttribute(uv, ic) }; };
    // el eje de la cara: la normal media de todos sus triángulos (las esquinas redondeadas se compensan)
    const media = new THREE.Vector3();
    for (let i = gr.start; i < gr.start + gr.count; i += 3) media.add(tri(i).n);
    const ax = ['x', 'y', 'z'].reduce((m, k) => Math.abs(media[k]) > Math.abs(media[m]) ? k : m, 'x');
    const eje = new THREE.Vector3(); eje[ax] = Math.sign(media[ax]);
    // un triángulo de la parte plana (normal igual al eje) para sacar hacia dónde crece la v de la textura
    let mejor = null;
    for (let i = gr.start; i < gr.start + gr.count && !mejor; i += 3) { const t = tri(i); if (t.n.dot(eje) > .999) mejor = t; }
    const { a, b, c, ua, ub, uc } = mejor; const n = eje;
    const e1 = b.clone().sub(a), e2 = c.clone().sub(a), d1 = ub.clone().sub(ua), d2 = uc.clone().sub(ua);
    const det = d1.x * d2.y - d2.x * d1.y;
    const B = e2.clone().multiplyScalar(d1.x).sub(e1.clone().multiplyScalar(d2.x)).multiplyScalar(1 / det);
    B.addScaledVector(n, -B.dot(n)).normalize();          // en el plano de la cara
    caras6[gr.materialIndex] = { n: new THREE.Vector3(Math.round(n.x), Math.round(n.y), Math.round(n.z)), t: B };
  });
}
// orientación final: la cara k arriba y su «arriba» mirando hacia el fondo (desde la cámara se lee derecho)
function orientacion(cara, donde, jitter = .2) {
  const lejos = new THREE.Vector3(donde.x - camara.position.x, 0, donde.z - camara.position.z).normalize();
  const local = new THREE.Matrix4().makeBasis(cara.t, cara.n, new THREE.Vector3().crossVectors(cara.t, cara.n));
  const mundo = new THREE.Matrix4().makeBasis(lejos, new THREE.Vector3(0, 1, 0), new THREE.Vector3().crossVectors(lejos, new THREE.Vector3(0, 1, 0)));
  const q = new THREE.Quaternion().setFromRotationMatrix(mundo.multiply(local.transpose()));
  return new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), azar(-jitter, jitter)).multiply(q);
}
d12.position.set(-.62, REPOSO12, .12); d12.quaternion.copy(orientacion(caras12[0], d12.position, .15));
d6.position.set(.6, REPOSO6, .05); d6.quaternion.copy(orientacion(caras6[2], d6.position, .15));

/* ───── el destello ───── */
const destellos = [];
function destello(obj, alto, fuerza = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texDestello, color: 0xfff1d0, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true }));
  const hacia = camara.position.clone().sub(obj.position).normalize();
  s.position.copy(obj.position).add(new THREE.Vector3(azar(-.06, .06), alto, 0)).addScaledVector(hacia, .12);
  escena.add(s); destellos.push({ s, t0: performance.now(), dur: 650, fuerza, obj });
}

/* ───── animaciones ───── */
const anims = new Set();
function anima(fn) { return new Promise(ok => { const t0 = performance.now(); anims.add(t => { const r = fn((t - t0) / 1000); if (r === false) ok(); return r; }); }); }
function gira(seg = .55) {        // una vuelta de manivela
  const a0 = brazo.rotation.x;
  return anima(t => { const u = Math.min(1, t / seg); brazo.rotation.x = a0 - Math.PI * 2 * (1 - Math.pow(1 - u, 2)); return u < 1 ? true : false; });
}
function lanza(dado, destino, qF, dur, alto) {
  const p0 = dado.position.clone(), q0 = dado.quaternion.clone();
  const ejeG = new THREE.Vector3(azar(-1, 1), azar(-.35, .35), azar(-1, 1)).normalize(), vueltas = azar(3.2, 4.6) * Math.PI;
  const q = new THREE.Quaternion(), r = new THREE.Quaternion();
  const mat = Array.isArray(dado.material) ? dado.material : (dado.children[0] && dado.children[0].material);
  return anima(t => {
    const u = Math.min(1, t / dur), e = 1 - Math.pow(1 - u, 3);
    dado.position.lerpVectors(p0, destino, e);
    dado.position.y = destino.y + (p0.y - destino.y) * (1 - e) + alto * Math.pow(1 - u, 1.5) * Math.abs(Math.sin(Math.PI * 3.15 * Math.pow(u, .82)));
    r.setFromAxisAngle(ejeG, vueltas * Math.pow(1 - u, 2.3)); q.copy(r).multiply(qF);
    dado.quaternion.slerpQuaternions(q0, q, Math.min(1, u / .12));
    return u < 1;
  });
}
function sitioLibre(xmin, xmax) { return new THREE.Vector3(azar(xmin, xmax), 0, azar(-.42, .42)); }
let tirando = false, encendidos = [];
function enciende(mat, color, fuerza) { mat.emissive.set(color); mat.emissiveIntensity = 0; encendidos.push(mat);
  return anima(t => { const u = Math.min(1, t / .5); mat.emissiveIntensity = fuerza * (1 - Math.pow(1 - u, 2)); return u < 1; }); }
function apaga() { encendidos.forEach(m => { m.emissiveIntensity = 0; m.emissive.set(0x000000); }); encendidos = []; }
const pausaMs = ms => new Promise(ok => setTimeout(ok, ms));
window.__dados.tira = async function (nota, figura, rapido) {
  if (tirando) return; tirando = true; apaga();
  // UNA vuelta de manivela (con su trinquete) y salen los dos dados, el de doce y enseguida el de seis
  suena('manivela', { gan: .8 });
  await gira(rapido ? .45 : .62);
  suena('dados_tirada_' + (1 + (Math.random() * 3 | 0)), { gan: .9 });
  const p12 = sitioLibre(-1.02, -.42); p12.y = REPOSO12;        // (cada dado en su mitad: no se pisan)
  const a = lanza(d12, p12, orientacion(caras12[nota - 1], p12), rapido ? .8 : .95, .55)
    .then(() => { destello(d12, R12 * .9, 1); enciende(calcos12[nota - 1], 0xff2fb0, 1.5); });     // el número de arriba se enciende, rosa fosforito
  await pausaMs(rapido ? 140 : 230);
  suena('dados_tirada_' + (1 + (Math.random() * 3 | 0)), { gan: .7 });
  const p6 = sitioLibre(.42, 1.02); p6.y = REPOSO6;
  const b = lanza(d6, p6, orientacion(caras6[figura], p6), rapido ? .75 : .9, .5)
    .then(() => { destello(d6, L6 * .6, 1); enciende(mats6[figura], 0x8dff14, 1.4); });            // y la figura de arriba, verde fosforito
  await Promise.all([a, b]);
  await pausaMs(rapido ? 120 : 220);
  tirando = false;
  return { nota, figura };
};
window.__dados.nombres = NOMBRES;

/* ───── el bucle ───── */
let proximoBrillo = performance.now() + 2500;
function bucle(t) {
  for (const f of [...anims]) if (f(t) === false) anims.delete(f);
  for (let i = destellos.length - 1; i >= 0; i--) {
    const d = destellos[i], u = (t - d.t0) / d.dur;
    if (u >= 1) { escena.remove(d.s); d.s.material.dispose(); destellos.splice(i, 1); continue; }
    const k = Math.sin(Math.PI * u) * d.fuerza; d.s.scale.setScalar(.05 + .38 * k); d.s.material.rotation = u * 1.2; d.s.material.opacity = Math.min(1, k * 1.2);
    if (d.obj === d12) mat12.emissive.setRGB(.2 * k, .15 * k, .06 * k);
  }
  if (!tirando && t > proximoBrillo) {      // de vez en cuando, un destello suelto en alguno de los dados (un brillo de luz, nada más)
    const cual = Math.random() < .5 ? d12 : d6; destello(cual, cual === d12 ? R12 * .85 : L6 * .55, .55);
    proximoBrillo = t + azar(3500, 7000);
  }
  render.render(escena, camara);
  requestAnimationFrame(bucle);
}

/* ───── a punto: fuentes y texturas de las figuras (las dibuja notacion.js de la página de fuera) ───── */
(async () => {
  try { await Promise.race([Promise.all([document.fonts.load('700 132px Poppins'), document.fonts.load('600 64px Lora')]), new Promise(ok => setTimeout(ok, 1500))]); } catch (e) {}
  FIGS.forEach((v, i) => { mats6[i].map = texFigura(v); mats6[i].emissiveMap = texFiguraBrillo(v); mats6[i].emissive.set(0x000000); mats6[i].needsUpdate = true; });
  requestAnimationFrame(bucle);
  listoOk(true);
})();
