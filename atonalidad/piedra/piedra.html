<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>La piedra</title>
<!-- «Atonalidad» · 2.5 · la piedra en 3D (Claude para Iago, 11-oct-2026, con el audio Froiz_9):
     «me gustaría que incluyas una piedra modelada en 3D… aprovecha el espacio a la izquierda… haz un modelado 3D que se adecue a la
     foto que ya hay». Es el cristal de N05: tallado, violeta y verde, flotando y con lucecitas alrededor.
     Va incrustada en la parada «piedra» (paradas2.js) con el fondo transparente. La página de fuera la maneja con
     window.__piedra.mide(0–4) (cada dato que se mide: un anillo de luz que la recorre) y window.__piedra.pulso() (cada nota de la obra). -->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="escena"></canvas>
<script type="importmap">{ "imports": { "three": "../candado/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
const azar = (a, b) => a + Math.random() * (b - a);
let listoOk; window.__piedra = { listo: new Promise(ok => listoOk = ok) };
const lienzo = document.getElementById('escena');
let render;
try { render = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true, alpha: true, preserveDrawingBuffer: true }); }
catch (e) { window.__piedra.sinWebGL = true; listoOk(false); throw e; }
render.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
render.outputColorSpace = THREE.SRGBColorSpace;
render.toneMapping = THREE.ACESFilmicToneMapping; render.toneMappingExposure = .95;
const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(32, 1, .1, 50);
camara.position.set(0, .25, 6.2); camara.lookAt(0, .1, 0);
function encaja() { const w = lienzo.clientWidth || innerWidth, h = lienzo.clientHeight || innerHeight; render.setSize(w, h, false); camara.aspect = w / h; camara.updateProjectionMatrix(); }
addEventListener('resize', encaja); encaja();

/* el entorno (solo para los reflejos): una vitrina oscura con lucecitas cálidas y dos brillos, violeta y verde */
{
  const sala = new THREE.Scene(), caja = new THREE.BoxGeometry(1, 1, 1);
  sala.add(new THREE.Mesh(new THREE.BoxGeometry(12, 9, 12), new THREE.MeshBasicMaterial({ color: 0x0c0812, side: THREE.BackSide })));
  const luz = (c, x, y, z, sx, sy, sz) => { const m = new THREE.Mesh(caja, new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, y, z); m.scale.set(sx, sy, sz); sala.add(m); };
  luz(0xffe0b0, 0, 4.2, 0, 3, .2, 3); luz(0xa45cff, -4.5, 1, 1, .2, 3, 3); luz(0x3dffa0, 4.5, .5, -1, .2, 2.4, 2.4); luz(0xffffff, 1.5, 2, 5, 1.2, 1.2, .2);
  escena.environment = new THREE.PMREMGenerator(render).fromScene(sala, .03).texture;
}
escena.add(new THREE.AmbientLight(0x3a2a5a, .3));
const l1 = new THREE.PointLight(0xb98bff, 13, 12, 2); l1.position.set(-2.4, 2.2, 2.6); escena.add(l1);
const l2 = new THREE.PointLight(0x40ff9e, 10, 12, 2); l2.position.set(2.6, -.8, 2.2); escena.add(l2);
const l3 = new THREE.PointLight(0xffe6c2, 6, 12, 2); l3.position.set(.5, 3.2, -2.5); escena.add(l3);

/* el cristal: una bipirámide tallada (como la de la foto), con cada vértice un poco movido y caras violetas, moradas y verdes */
const grupo = new THREE.Group(); escena.add(grupo);
let semilla = 7; const rnd = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
function talla(geo, sx, sy, sz, desv) {
  const pos = geo.attributes.position, mapa = new Map();      // (los vértices repetidos se mueven igual: la piedra no se abre)
  for (let i = 0; i < pos.count; i++) {
    const k = [pos.getX(i), pos.getY(i), pos.getZ(i)].map(v => v.toFixed(4)).join(',');
    if (!mapa.has(k)) mapa.set(k, 1 + (rnd() - .5) * desv);
    const f = mapa.get(k);
    pos.setXYZ(i, pos.getX(i) * sx * f, pos.getY(i) * sy * f, pos.getZ(i) * sz * f);
  }
  geo.computeVertexNormals(); return geo;
}
const perfil = [[0, -1.5], [.42, -.95], [.62, -.25], [.66, .2], [.5, .8], [0, 1.55]].map(([x, y]) => new THREE.Vector2(x, y));
const geo = talla(new THREE.LatheGeometry(perfil, 7).toNonIndexed(), 1.0, 1.0, .86, .12);
{
  const PAL = [[.5, .12, .92], [.66, .28, 1.0], [.32, .06, .62], [.12, .74, .44], [.2, .82, .52], [.74, .34, 1.0], [.58, .12, .78]];
  const col = new Float32Array(geo.attributes.position.count * 3);
  for (let f = 0; f < geo.attributes.position.count; f += 3) {
    const c = PAL[Math.floor(rnd() * PAL.length)], b = .55 + rnd() * .45;
    for (let v = 0; v < 3; v++) { col[(f + v) * 3] = c[0] * b; col[(f + v) * 3 + 1] = c[1] * b; col[(f + v) * 3 + 2] = c[2] * b; }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}
const matCristal = new THREE.MeshPhysicalMaterial({ vertexColors: true, flatShading: true, metalness: .35, roughness: .08, clearcoat: 1, clearcoatRoughness: .05,
  iridescence: .45, iridescenceIOR: 1.6, emissive: 0x2a0a5a, emissiveIntensity: .5, transparent: true, opacity: .9, envMapIntensity: .85, side: THREE.DoubleSide });
const cristal = new THREE.Mesh(geo, matCristal); grupo.add(cristal);
// el corazón: un cristal más pequeño que brilla por dentro
const corazon = new THREE.Mesh(talla(new THREE.IcosahedronGeometry(.36, 0), .8, 1.5, .8, .3),
  new THREE.MeshBasicMaterial({ color: 0xc58bff, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
grupo.add(corazon);
// las aristas, muy finas y claras (talla)
const aristas = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 12), new THREE.LineBasicMaterial({ color: 0xf2e6ff, transparent: true, opacity: .22 }));
grupo.add(aristas);
// el halo de detrás
function texHalo(c1, c2) { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, c1); r.addColorStop(.35, c2); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: texHalo('rgba(170,90,255,.5)', 'rgba(90,30,200,.16)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
halo.scale.set(4.6, 5.4, 1); halo.position.z = -.6; grupo.add(halo);
// las lucecitas de alrededor (como en la vitrina de la foto)
const nLuces = 90, posL = new Float32Array(nLuces * 3), faseL = [];
for (let i = 0; i < nLuces; i++) { const a = rnd() * Math.PI * 2, r = 1.25 + rnd() * 1.3, y = (rnd() - .5) * 3.6; posL.set([Math.cos(a) * r, y, Math.sin(a) * r * .6 - .2], i * 3); faseL.push(rnd() * 6.3); }
const geoL = new THREE.BufferGeometry(); geoL.setAttribute('position', new THREE.BufferAttribute(posL, 3));
const texChispa = texHalo('rgba(255,244,214,1)', 'rgba(255,214,150,.35)');
const chispas = new THREE.Points(geoL, new THREE.PointsMaterial({ map: texChispa, size: .16, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffe9c4, opacity: .85 }));
escena.add(chispas);

/* lo que pasa al medir: un anillo de luz recorre la piedra de abajo arriba, del color del dato */
const COLORES = [0xb26bff, 0xffb347, 0xff6b4a, 0x3df2ff, 0x8dff14];
const anims = new Set();
function anima(fn) { return new Promise(ok => { const t0 = performance.now(); anims.add(t => { const r = fn((t - t0) / 1000); if (r === false) ok(); return r; }); }); }
let brilloExtra = 0, colorBrillo = new THREE.Color(0x32106a);
window.__piedra.mide = function (i) {
  const color = COLORES[i % COLORES.length];
  const anillo = new THREE.Mesh(new THREE.TorusGeometry(1, .025, 8, 80), new THREE.MeshBasicMaterial({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  anillo.rotation.x = Math.PI / 2; escena.add(anillo);
  colorBrillo.set(color);
  return anima(t => {
    const u = Math.min(1, t / 1.5), y = -1.5 + 3 * u, ancho = Math.max(.12, Math.sqrt(Math.max(0, 1 - (y / 1.45) ** 2))) * .95 + .12;
    anillo.position.y = y + grupo.position.y; anillo.scale.set(ancho, ancho, 1); anillo.material.opacity = Math.sin(Math.PI * u);
    brilloExtra = Math.max(brilloExtra, .9 * Math.sin(Math.PI * u));
    if (u >= 1) { escena.remove(anillo); anillo.geometry.dispose(); anillo.material.dispose(); return false; }
    return true;
  });
};
window.__piedra.pulso = function (fuerza = .6) { colorBrillo.set(0xd9a8ff); brilloExtra = Math.max(brilloExtra, fuerza); };
window.__piedra.analizada = function () { matCristal.emissiveIntensity = .8; };

/* el bucle: gira despacio y flota */
let t0 = performance.now(), tAnt = null;
function bucle(t) {
  const s = (t - t0) / 1000, dt = tAnt == null ? 0 : Math.min(.2, (t - tAnt) / 1000); tAnt = t;
  for (const f of [...anims]) if (f(t) === false) anims.delete(f);
  grupo.rotation.y = s * .32; grupo.rotation.z = Math.sin(s * .5) * .06; grupo.position.y = Math.sin(s * .9) * .1;
  brilloExtra *= Math.exp(-dt / .45);          // se apaga igual de rápido vaya el ordenador como vaya
  matCristal.emissive.copy(new THREE.Color(0x32106a).lerp(colorBrillo, Math.min(1, brilloExtra)));
  corazon.material.opacity = .45 + .25 * Math.sin(s * 2.1) + brilloExtra * .4;
  halo.material.opacity = .75 + .2 * Math.sin(s * 1.3) + brilloExtra * .3;
  chispas.material.opacity = .6 + .3 * Math.sin(s * 3.1);
  chispas.rotation.y = -s * .05;
  render.render(escena, camara);
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
listoOk(true);
</script>
</body>
</html>
